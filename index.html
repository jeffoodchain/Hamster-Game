
<div style="position:relative;width:100%;height:580px;border-radius:16px;overflow:hidden;background:#f5efe6;">
<canvas id="hc" width="680" height="580" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;"></canvas>
<div id="hst" style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;color:#6b5240;background:rgba(250,244,234,0.9);padding:3px 14px;border-radius:20px;pointer-events:none;white-space:nowrap;"></div>
<button id="backBtn" style="display:none;position:absolute;top:10px;right:12px;font-size:11px;padding:5px 12px;border-radius:20px;border:1.5px solid rgba(140,90,40,0.4);background:rgba(250,244,234,0.92);color:#6b4420;cursor:pointer;font-family:sans-serif;">⬅ Change Hamster</button>
</div>
<script>
(function(){
const cv=document.getElementById('hc');
const ct=cv.getContext('2d');
const st=document.getElementById('hst');
const backBtn=document.getElementById('backBtn');
let W=680,H=580,gameScreen='select',selectedHam=0;
function resize(){const r=cv.parentElement.getBoundingClientRect();W=cv.width=Math.round(r.width)||680;H=cv.height=Math.round(r.height)||580;}
resize();window.addEventListener('resize',function(){resize();if(gameScreen==='game')buildBg();});

const HAMS=[
  {name:'\u8c9d\u8c9d',roman:'p\xe9p\xe9',  type:'dwarf', body:'#f2eeea',belly:'#fdfaf7',ear:'#ebbdad',earIn:'#f0c8b8',nose:'#d4968a',eye:'#1a1008',stripe:null,     desc:'White Dwarf',       fat:1.0,  yuanbao:false},
  {name:'\u5927\u871c',roman:'mii',         type:'dwarf', body:'#8a8276',belly:'#ccc8b8',ear:'#b09888',earIn:'#d4b0a0',nose:'#907060',eye:'#1a1008',stripe:'#5a5650', desc:'Grey Agouti Dwarf', fat:1.0,  yuanbao:false},
  {name:'\u81ed\u81ed',roman:'stanky',      type:'dwarf', body:'#b0adb8',belly:'#dcdae4',ear:'#c0b0c8',earIn:'#d8c8dc',nose:'#b09098',eye:'#1a1028',stripe:'#888098', desc:'Blue-Grey Dwarf',   fat:1.0,  yuanbao:false},
  {name:'\u86cb\u86cb',roman:'egg',         type:'syrian',body:'#d48c3a',belly:'#f0d080',ear:'#c07030',earIn:'#e09858',nose:'#c06040',eye:'#1a0808',stripe:null,       desc:'Golden Syrian',     fat:1.0,  yuanbao:false},
  {name:'\u6c90\u6c90',roman:'mumu',        type:'syrian',body:'#f5f0ec',belly:'#fffcfa',ear:'#f0b8a8',earIn:'#ffd0c0',nose:'#d08070',eye:'#c03020',stripe:null,       desc:'Albino Syrian',     fat:1.0,  yuanbao:false},
  {name:'\u963f\u8ca1',roman:'A tsai',      type:'dwarf', body:'#8a8276',belly:'#ccc8b8',ear:'#b09888',earIn:'#d4b0a0',nose:'#907060',eye:'#1a1008',stripe:'#5a5650', desc:'Chubby Dwarf',      fat:1.15, yuanbao:true},
];

function FLY(){return H*0.60;}
function FBOT(){return H-18;}
function WCX(){return W*0.18;}
function WR(){return Math.min(88,W*0.13);}
function WCY(){return FLY()-WR()-2;}
function BCX(){return W*0.88;}
function BCY(){return FLY()-72;}
function BINX(){return W-54;}
function BINY(){return H-44;}
function BASKX(){return W*0.28;}
function BASKY(){return FLY()+28;}
function HUT_X(){return W*0.72;}
function HUT_Y(){return FLY()-2;}
function feetY(cy){return cy+28;}
function GY_TOP(){return FLY()+22;}
function GY_BOT(){return FBOT()-40;}
function mkRng(seed){var s=seed>>>0;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};}

var hearts=[];
function spawnHearts(x,y){
  var colors=['#ff6b8a','#ff9eb5','#ff4466','#ffb3c6','#ff2255'];
  for(var i=0;i<5;i++){hearts.push({x:x+(Math.random()-0.5)*30,y:y-20,vx:(Math.random()-0.5)*1.2,vy:-(1.2+Math.random()*1.4),size:6+Math.random()*7,color:colors[i%colors.length],alpha:1,wobble:Math.random()*Math.PI*2,life:0});}
}
function drawHeart(c,x,y,size,color,alpha){
  c.save();c.globalAlpha=alpha;c.translate(x,y);c.fillStyle=color;c.beginPath();
  c.moveTo(0,-size*0.5);c.bezierCurveTo(size*0.5,-size*1.1,size*1.1,-size*0.3,0,size*0.6);c.bezierCurveTo(-size*1.1,-size*0.3,-size*0.5,-size*1.1,0,-size*0.5);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,0.4)';c.beginPath();c.arc(-size*0.2,-size*0.3,size*0.18,0,Math.PI*2);c.fill();c.restore();
}
function updateDrawHearts(){
  hearts=hearts.filter(function(h){h.life++;h.x+=h.vx+Math.sin(h.wobble+h.life*0.12)*0.4;h.y+=h.vy;h.vy*=0.97;h.alpha=Math.max(0,1-h.life/55);if(h.alpha<=0)return false;drawHeart(ct,h.x,h.y,h.size,h.color,h.alpha);return true;});
}

// 畫船型元寶 - 根據參考圖
function drawYuanbao(c,x,y,size){
  c.save();c.translate(x,y);c.scale(size,size);
  
  // 船型底部（兩頭翹起的船型）
  c.fillStyle='#d4a020';
  c.beginPath();
  // 左邊翹起的端
  c.moveTo(-7,-2);
  c.quadraticCurveTo(-7,-4,-6,-5);
  // 左上弧線
  c.quadraticCurveTo(-3,-6,0,-6);
  // 右上弧線
  c.quadraticCurveTo(3,-6,6,-5);
  // 右邊翹起的端
  c.quadraticCurveTo(7,-4,7,-2);
  // 底部弧線（中間凹陷）
  c.quadraticCurveTo(5,0,0,1);
  c.quadraticCurveTo(-5,0,-7,-2);
  c.closePath();c.fill();
  
  // 亮面（頂部高光）
  c.fillStyle='#f0d060';
  c.beginPath();
  c.moveTo(-5,-3.5);
  c.quadraticCurveTo(-2,-5,0,-5);
  c.quadraticCurveTo(2,-5,5,-3.5);
  c.quadraticCurveTo(3,-2,0,-1.5);
  c.quadraticCurveTo(-3,-2,-5,-3.5);
  c.closePath();c.fill();
  
  // 頂部最亮的高光
  c.fillStyle='rgba(255,245,200,0.7)';
  c.beginPath();
  c.ellipse(-2,-4,2,1,0,0,Math.PI*2);
  c.fill();
  c.beginPath();
  c.ellipse(2,-4,1.5,0.8,0,0,Math.PI*2);
  c.fill();
  
  // 暗面（底部陰影）
  c.fillStyle='rgba(160,100,20,0.4)';
  c.beginPath();
  c.moveTo(-6,-1);
  c.quadraticCurveTo(-3,0.5,0,0.8);
  c.quadraticCurveTo(3,0.5,6,-1);
  c.quadraticCurveTo(4,0.2,0,0.5);
  c.quadraticCurveTo(-4,0.2,-6,-1);
  c.closePath();c.fill();
  
  // 福字
  c.fillStyle='#8a2010';
  c.font='bold 5px sans-serif';
  c.textAlign='center';
  c.textBaseline='middle';
  c.fillText('\u798f',0,-2.5);
  
  c.restore();
}

function resetGame(){
  mode='wander';hx=W*0.45;hy=GY_TOP()+(GY_BOT()-GY_TOP())*0.4;hvx=0.8;hvy=0.4;hdir=1;htgt=0;htimer=120;hbob=0;hleg=0;hblink=false;hblinkT=90;hcheek=0;hcheekD=1;
  runSpd=0;runTgt=0;wTimer=0;wAngle=0;csx=0;csy=0;climbT=0;dsx=0;dsy=0;drnkT=0;dframes=0;eatTimer=0;
  toHutT=0;fromHutT=0;hutSX=0;hutSY=0;napTimer=0;napDuration=0;nextNap=1800+Math.floor(Math.random()*1800);frame=0;
  poops=[];flyingPoops=[];flyingItems=[];shells=[];poopTick=0;hearts=[];
  drag={active:false,seedIdx:-1,x:0,y:0,type:'',angle:0};binCount=0;initBasket();
}

var bgCv=document.createElement('canvas');
function buildBg(){
  bgCv.width=W;bgCv.height=H;var c=bgCv.getContext('2d'),r=mkRng(7),fy=FLY();var tL=14,tR=W-14,tT=30,tB=H-10;
  c.fillStyle='#ede8d5';c.fillRect(tL,tT,tR-tL,tB-tT);c.fillStyle='#d4c49e';c.fillRect(tL,fy,tR-tL,tB-fy);c.strokeStyle='rgba(170,140,95,0.5)';c.lineWidth=1;
  for(var i=0;i<200;i++){var bx=tL+r()*(tR-tL),by=fy+4+r()*(tB-fy-10),ln=4+r()*14,an=r()*Math.PI;c.beginPath();c.moveTo(bx,by);c.lineTo(bx+Math.cos(an)*ln,by+Math.sin(an)*ln);c.stroke();}
  c.fillStyle='#c8b888';c.beginPath();c.ellipse(W*0.55,fy+2,W*0.24,24,0,0,Math.PI*2);c.fill();c.fillStyle='#e8dfbc';c.beginPath();c.ellipse(W*0.3,fy+18,58,17,0,0,Math.PI*2);c.fill();
  var f1=W*0.22,f2=W*0.44,fc=13,fsp=(f2-f1)/fc;for(var j=0;j<=fc;j++){c.fillStyle='#c4a06a';c.fillRect(f1+j*fsp-3,fy-20,6,22);}c.fillStyle='rgba(180,138,88,0.4)';c.fillRect(f1,fy-10,f2-f1,4);
  var lx=W*0.52,ly=fy-18,lw=88,lh=22;c.fillStyle='#a07848';c.beginPath();c.moveTo(lx+lh/2,ly);c.lineTo(lx+lw-lh/2,ly);c.arc(lx+lw-lh/2,ly+lh/2,lh/2,0-Math.PI/2,Math.PI/2);c.lineTo(lx+lh/2,ly+lh);c.arc(lx+lh/2,ly+lh/2,lh/2,Math.PI/2,0-Math.PI/2);c.closePath();c.fill();
  c.strokeStyle='#7a5828';c.lineWidth=1.5;for(var k=1;k<5;k++){c.beginPath();c.moveTo(lx+lw*k/5,ly+2);c.lineTo(lx+lw*k/5,ly+lh-2);c.stroke();}c.fillStyle='#3a2010';c.beginPath();c.ellipse(lx+18,ly+lh/2,10,8,0,0,Math.PI*2);c.fill();
  var kx=W*0.48,ky=fy-8;c.fillStyle='#5a4030';c.beginPath();c.arc(kx,ky,22,0,Math.PI*2);c.fill();c.fillStyle='#3a2010';c.beginPath();c.arc(kx,ky,10,0,Math.PI*2);c.fill();
  var sx=W*0.38,sy=fy-26,sr=32,sh=28;c.fillStyle='#b8a07a';c.beginPath();c.ellipse(sx,sy+sh,sr,10,0,0,Math.PI*2);c.fill();c.fillStyle='#c8b08a';c.fillRect(sx-sr,sy,sr*2,sh);c.fillStyle='#b8a07a';c.beginPath();c.ellipse(sx,sy,sr,10,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(148,118,68,0.4)';c.lineWidth=1;for(var m=1;m<4;m++){c.beginPath();c.ellipse(sx,sy,sr*m/4,10*m/4,0,0,Math.PI*2);c.stroke();}
  c.fillStyle='#c4a06a';c.save();c.translate(W*0.24,fy+2);c.rotate(-0.22);c.fillRect(0,-16,56,16);c.strokeStyle='#a07838';c.lineWidth=1.5;for(var n=1;n<5;n++){c.beginPath();c.moveTo(56*n/5,-16);c.lineTo(56*n/5,0);c.stroke();}c.restore();
  [[W*0.27,fy+14,10,7],[W*0.33,fy+20,8,6]].forEach(function(p){c.fillStyle='#888068';c.beginPath();c.ellipse(p[0],p[1],p[2],p[3],0.3,0,Math.PI*2);c.fill();});
  function pl(px,py,col,n){for(var i=0;i<n;i++){var ang=0-Math.PI/2+(r()-0.5)*1.1,len=16+r()*20,ex=px+Math.cos(ang)*len,ey=py+Math.sin(ang)*len;c.strokeStyle=col;c.lineWidth=1.2;c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(px+(r()-0.5)*10,py-len*0.5,ex,ey);c.stroke();c.fillStyle=col;c.beginPath();c.arc(ex,ey,1.5+r()*2,0,Math.PI*2);c.fill();}}
  pl(W*0.58,fy-10,'#8a7a5e',3);pl(W*0.64,fy-6,'#7a6a4e',4);pl(W*0.70,fy-14,'#6a5a46',3);pl(W*0.78,fy-8,'#9a8a68',4);pl(W*0.83,fy-4,'#7e6e52',3);pl(W*0.15,fy-6,'#7a6a4e',4);pl(W*0.12,fy-10,'#8a7a5e',3);
  c.fillStyle='#8a7050';c.beginPath();c.ellipse(W*0.6,fy-10,28,17,0,0,Math.PI*2);c.fill();c.fillStyle='#2a1a0a';c.beginPath();c.ellipse(W*0.6,fy-10,18,11,0,0,Math.PI*2);c.fill();
  var tx=W*0.44,ty=fy-54,trd=25,tth=50;c.fillStyle='#c8a86a';c.fillRect(tx-trd,ty,trd*2,tth);c.strokeStyle='#a07838';c.lineWidth=1.5;for(var q=0;q<8;q++){c.beginPath();c.moveTo(tx-trd,ty+q*tth/8);c.lineTo(tx+trd,ty+q*tth/8);c.stroke();}c.fillStyle='#b09058';c.beginPath();c.ellipse(tx,ty,trd,7,0,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(tx,ty+tth,trd,7,0,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(180,210,230,0.5)';c.lineWidth=6;c.strokeRect(tL,tT,tR-tL,tB-tT);c.fillStyle='rgba(255,255,255,0.07)';c.fillRect(tL+6,tT+6,26,tB-tT-12);c.fillStyle='#cacaca';c.fillRect(tL,tT,tR-tL,7);
}

var wAngle=0;
function drawWheel(){
  var r=WR(),ccx=WCX(),ccy=WCY(),fy=FLY();ct.strokeStyle='#a07838';ct.lineWidth=7;ct.lineCap='round';
  ct.beginPath();ct.moveTo(ccx-r*0.5,ccy+r);ct.lineTo(ccx-r*0.4,fy+6);ct.stroke();ct.beginPath();ct.moveTo(ccx+r*0.5,ccy+r);ct.lineTo(ccx+r*0.4,fy+6);ct.stroke();
  ct.lineWidth=9;ct.beginPath();ct.moveTo(ccx-r*0.55,fy+4);ct.lineTo(ccx+r*0.55,fy+4);ct.stroke();ct.strokeStyle='#c8a058';ct.lineWidth=13;ct.beginPath();ct.arc(ccx,ccy,r,0,Math.PI*2);ct.stroke();
  ct.strokeStyle='#9a7838';ct.lineWidth=2;ct.beginPath();ct.arc(ccx,ccy,r+5,0,Math.PI*2);ct.stroke();ct.beginPath();ct.arc(ccx,ccy,r-5,0,Math.PI*2);ct.stroke();ct.strokeStyle='#b88a48';ct.lineWidth=4;ct.lineCap='round';
  for(var i=0;i<8;i++){var a=wAngle+i*Math.PI/4;ct.beginPath();ct.moveTo(ccx+Math.cos(a)*11,ccy+Math.sin(a)*11);ct.lineTo(ccx+Math.cos(a)*(r-7),ccy+Math.sin(a)*(r-7));ct.stroke();}
  ct.save();ct.beginPath();ct.arc(ccx,ccy,r-7,0,Math.PI*2);ct.clip();ct.strokeStyle='rgba(158,118,58,0.32)';ct.lineWidth=1.5;var scroll=(wAngle*r/Math.PI)%7;for(var j=0-Math.ceil(r/7);j<=Math.ceil(r/7);j++){var yy=ccy+j*7+scroll;ct.beginPath();ct.moveTo(ccx-r,yy);ct.lineTo(ccx+r,yy);ct.stroke();}ct.restore();
  ct.fillStyle='#c8a058';ct.beginPath();ct.arc(ccx,ccy,15,0,Math.PI*2);ct.fill();ct.strokeStyle='#7a4e28';ct.lineWidth=3;ct.beginPath();ct.arc(ccx,ccy,15,0,Math.PI*2);ct.stroke();ct.fillStyle='#7a4e28';ct.beginPath();ct.arc(ccx,ccy,5,0,Math.PI*2);ct.fill();
  if(mode==='wander'){ct.font='11px sans-serif';ct.fillStyle='rgba(100,72,42,0.65)';ct.textAlign='center';ct.fillText('click wheel',ccx,ccy+r+22);}
}
function drawBottle(){
  var bx=BCX(),by=BCY(),bw=22,bh=52;ct.fillStyle='#aaa';ct.fillRect(bx-2,by-8,bw+4,5);ct.fillStyle='rgba(148,208,228,0.75)';ct.fillRect(bx,by,bw,bh);ct.fillStyle='rgba(98,178,218,0.45)';ct.fillRect(bx+2,by+bh*0.35,bw-4,bh*0.62);ct.fillStyle='rgba(255,255,255,0.35)';ct.fillRect(bx+3,by+4,5,bh*0.38);ct.fillStyle='#888';ct.fillRect(bx+bw/2-3,by+bh,6,10);ct.fillStyle='#666';ct.beginPath();ct.arc(bx+bw/2,by+bh+10,4,0,Math.PI*2);ct.fill();ct.font='8px sans-serif';ct.fillStyle='rgba(48,98,118,0.9)';ct.textAlign='center';ct.fillText('H2O',bx+bw/2,by+bh*0.22);
  if(mode==='wander'){ct.font='11px sans-serif';ct.fillStyle='rgba(100,72,42,0.65)';ct.textAlign='center';ct.fillText('click water',bx+bw/2,by-16);}
}
function drawHut(){
  var hx=HUT_X(),hy=HUT_Y(),hw=54,hh=46;ct.fillStyle='rgba(0,0,0,0.06)';ct.beginPath();ct.ellipse(hx,hy+4,hw*0.55,7,0,0,Math.PI*2);ct.fill();
  ct.fillStyle='#c8a870';ct.fillRect(hx-hw/2,hy-hh,hw,hh);ct.strokeStyle='rgba(100,70,30,0.2)';ct.lineWidth=1;for(var i=0;i<5;i++){ct.beginPath();ct.moveTo(hx-hw/2,hy-hh+i*10);ct.lineTo(hx+hw/2,hy-hh+i*10);ct.stroke();}
  ct.fillStyle='#8a5a28';ct.beginPath();ct.moveTo(hx-hw/2-6,hy-hh);ct.lineTo(hx,hy-hh-28);ct.lineTo(hx+hw/2+6,hy-hh);ct.closePath();ct.fill();ct.strokeStyle='#6a4018';ct.lineWidth=1;for(var s=0;s<4;s++){ct.beginPath();ct.moveTo(hx-hw/2-6+s*18,hy-hh);ct.lineTo(hx-hw/2-6+s*18+9,hy-hh-14);ct.stroke();}
  ct.fillStyle=mode==='napping'?'#1a0a04':'#3a2010';ct.beginPath();ct.arc(hx,hy-12,13,Math.PI,0);ct.lineTo(hx+13,hy);ct.lineTo(hx-13,hy);ct.closePath();ct.fill();
  ct.strokeStyle='#6a3a18';ct.lineWidth=2;ct.beginPath();ct.arc(hx,hy-12,13,Math.PI,0);ct.lineTo(hx+13,hy);ct.stroke();
  if(mode==='napping'){var zOff=Math.sin(frame*0.04)*4;ct.font='13px sans-serif';ct.fillStyle='rgba(178,118,78,0.85)';ct.textAlign='center';ct.fillText('z z z',hx+16,hy-hh-32+zOff);}
  if(mode==='wander'){ct.font='10px sans-serif';ct.fillStyle='rgba(100,72,42,0.6)';ct.textAlign='center';ct.fillText('nap hut',hx,hy+16);}
}
var binCount=0;
function drawBin(){
  var bx=BINX(),by=BINY();ct.fillStyle='rgba(0,0,0,0.08)';ct.beginPath();ct.ellipse(bx,by+6,26,6,0,0,Math.PI*2);ct.fill();
  ct.fillStyle='#7a9e6a';ct.beginPath();ct.moveTo(bx-20,by-30);ct.lineTo(bx+20,by-30);ct.lineTo(bx+16,by+4);ct.lineTo(bx-16,by+4);ct.closePath();ct.fill();
  ct.fillStyle='rgba(255,255,255,0.12)';ct.beginPath();ct.moveTo(bx-18,by-28);ct.lineTo(bx-8,by-28);ct.lineTo(bx-10,by+2);ct.lineTo(bx-16,by+2);ct.closePath();ct.fill();
  ct.strokeStyle='rgba(40,80,30,0.3)';ct.lineWidth=1.5;ct.beginPath();ct.moveTo(bx-5,by-30);ct.lineTo(bx-4,by+4);ct.stroke();ct.beginPath();ct.moveTo(bx+6,by-30);ct.lineTo(bx+5,by+4);ct.stroke();
  ct.fillStyle='#6a8e5a';ct.fillRect(bx-23,by-36,46,8);ct.fillStyle='#8ab87a';ct.fillRect(bx-21,by-36,42,3);ct.fillStyle='#5a7e4a';ct.fillRect(bx-5,by-42,10,7);ct.fillStyle='#7aae6a';ct.fillRect(bx-4,by-42,8,3);
  ct.fillStyle='rgba(255,255,255,0.6)';ct.font='bold 11px sans-serif';ct.textAlign='center';ct.fillText('\u267b',bx,by-12);
  if(binCount>0){ct.fillStyle='#e05a2a';ct.beginPath();ct.arc(bx+16,by-32,9,0,Math.PI*2);ct.fill();ct.fillStyle='#fff';ct.font='bold 9px sans-serif';ct.textAlign='center';ct.fillText(binCount,bx+16,by-29);}
  ct.font='10px sans-serif';ct.fillStyle='rgba(60,90,40,0.75)';ct.textAlign='center';ct.fillText('poop bin',bx,by+18);
}

var SEED_TYPES=['sunflower','millet','pumpkin'];var basketSeeds=[];
function initBasket(){basketSeeds=[];var offsets=[[-8,-6],[4,-8],[-12,2],[6,2],[-4,8],[8,-2]];offsets.forEach(function(o,i){basketSeeds.push({type:SEED_TYPES[i%3],ox:o[0],oy:o[1],dragging:false,eaten:false});});}
initBasket();
function drawSeed(c,x,y,type,angle,scale){

var mode='wander';var hx=0,hy=0,hvx=0.8,hvy=0.3,hdir=1;var htgt=0,htimer=120,hspeed=1.1;var hbob=0,hleg=0,hblink=false,hblinkT=90,hcheek=0,hcheekD=1;

  if(mode==='onwheel')return wpos();

  if(mode==='descending')return lerp2(wpos(),{x:csx,y:csy},climbT);

function tick(){
  frame++;poopTick++;

  nextNap--;if(nextNap<=0&&mode==='wander'){nextNap=1800+Math.floor(Math.random()*1800);goNap();}
  var xL=60,xR=W-60,yT=GY_TOP(),yB=GY_BOT();
  if(mode==='wander'){
    var ax=Math.cos(htgt)*0.10,ay=Math.sin(htgt)*0.10;hvx+=ax;hvy+=ay;
    var spd=Math.sqrt(hvx*hvx+hvy*hvy);if(spd>hspeed){hvx=hvx/spd*hspeed;hvy=hvy/spd*hspeed;}
    hx+=hvx;hy+=hvy;
    if(hx<xL){hx=xL;hvx=Math.abs(hvx);htgt=Math.atan2(hvy,Math.abs(hvx))+(Math.random()-0.5)*0.6;}
    if(hx>xR){hx=xR;hvx=0-Math.abs(hvx);htgt=Math.atan2(hvy,0-Math.abs(hvx))+(Math.random()-0.5)*0.6;}
    if(hy<yT){hy=yT;hvy=Math.abs(hvy);htgt=Math.atan2(Math.abs(hvy),hvx)+(Math.random()-0.5)*0.6;}
    if(hy>yB){hy=yB;hvy=0-Math.abs(hvy);htgt=Math.atan2(0-Math.abs(hvy),hvx)+(Math.random()-0.5)*0.6;}
    if(Math.abs(hvx)>0.1)hdir=hvx>0?1:0-1;hbob=Math.sin(frame*0.22)*2;hleg+=spd*0.18;htimer--;
    if(htimer<=0)setTgt();
    if(htimer===80&&Math.random()<0.18)goWheel();
    if(htimer===40&&Math.random()<0.1)goDrink();
  } else if(mode==='happy'){
    hvx*=0.85;hvy*=0.85;hbob=Math.sin(frame*0.35)*4;hleg+=0.15;htimer--;
    if(htimer<=0){mode='wander';setTgt();say('Click hamster \xb7 wheel \xb7 water \xb7 drag seed');}
  } else if(mode==='eating'){
    hbob=Math.sin(frame*0.4)*2;hleg+=0.08;eatTimer--;
    if(eatTimer<=0){mode='wander';setTgt();say('Click hamster \xb7 wheel \xb7 water \xb7 drag seed');}
  } else if(mode==='climbing'){climbT+=0.024;hleg+=0.14;hdir=-1;if(climbT>=1){climbT=1;mode='onwheel';}}
  else if(mode==='onwheel'){runSpd+=(runTgt-runSpd)*0.04;wAngle-=runSpd;hleg+=runSpd*22;hbob=Math.sin(frame*0.44)*1.5;wTimer--;if(wTimer<=0){runTgt*=0.88;if(runSpd<0.004){mode='descending';climbT=0;say('Phew!');}}}
  else if(mode==='descending'){climbT+=0.024;hleg+=0.1;if(climbT>=1){climbT=1;hx=csx;hy=csy;mode='wander';setTgt();say('Click hamster \xb7 wheel \xb7 water \xb7 drag seed');}}
  else if(mode==='todrink'){drnkT+=0.026;hleg+=0.13;hdir=1;hbob=Math.sin(frame*0.18)*2;if(drnkT>=1){drnkT=1;mode='drinking';dframes=210;}}

  else if(mode==='fromdink'){drnkT+=0.026;hleg+=0.13;hdir=-1;if(drnkT>=1){drnkT=1;hx=dsx;hy=dsy;mode='wander';setTgt();say('Click hamster \xb7 wheel \xb7 water \xb7 drag seed');}}
  else if(mode==='tohut'){toHutT+=0.022;hleg+=0.12;hdir=HUT_X()>hx?1:-1;if(toHutT>=1){toHutT=1;mode='napping';napTimer=napDuration;say(HAMS[selectedHam].name+' is napping in the hut... zzz');}}
  else if(mode==='napping'){napTimer--;if(napTimer<=0){mode='fromhut';fromHutT=0;say(HAMS[selectedHam].name+' woke up!');}}
  else if(mode==='fromhut'){fromHutT+=0.022;hleg+=0.1;if(fromHutT>=1){fromHutT=1;hx=hutSX;hy=hutSY;mode='wander';setTgt();nextNap=1800+Math.floor(Math.random()*1800);say('Click hamster \xb7 wheel \xb7 water \xb7 drag seed');}}
  hblinkT--;if(hblinkT<=0){hblink=!hblink;hblinkT=hblink?5:60+Math.random()*110;}
  hcheek+=hcheekD*0.02;if(hcheek>1){hcheek=1;hcheekD=-1;}if(hcheek<0){hcheek=0;hcheekD=1;}

}

var selHover=-1;
function cardBounds(i){var cols=3,cw=Math.min(158,(W-80)/3),ch=158,gap=12,totalW=cols*cw+(cols-1)*gap,gx=(W-totalW)/2,gy=86;return{x:gx+(i%cols)*(cw+gap),y:gy+Math.floor(i/cols)*(ch+gap),w:cw,h:ch};}
function drawHamPortrait(c,h,x,y,scale){
  c.save();c.translate(x,y);c.scale(scale*h.fat,scale*h.fat);
  var isSyr=h.type==='syrian',br=isSyr?30:24;
  c.fillStyle=h.body;c.save();c.scale(1,0.82);c.beginPath();c.arc(0,0,br,0,Math.PI*2);c.fill();c.restore();c.fillStyle=h.belly;c.beginPath();c.arc(0,8,isSyr?19:15,0,Math.PI*2);c.fill();
  if(h.stripe){c.strokeStyle=h.stripe;c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(0,-22);c.lineTo(0,6);c.stroke();}
  var er=isSyr?10:8,ei=isSyr?6:5;[[-16,-22],[16,-22]].forEach(function(e){c.beginPath();c.arc(e[0],e[1],er,0,Math.PI*2);c.fillStyle=h.ear;c.fill();c.beginPath();c.arc(e[0],e[1],ei,0,Math.PI*2);c.fillStyle=h.earIn;c.fill();});
  [[-9,-7],[9,-7]].forEach(function(e){c.beginPath();c.arc(e[0],e[1],4.5,0,Math.PI*2);c.fillStyle=h.eye;c.fill();if(h.eye==='#c03020'){c.fillStyle='rgba(255,80,60,0.35)';c.beginPath();c.arc(e[0],e[1],4.5,0,Math.PI*2);c.fill();}c.fillStyle='rgba(255,255,255,0.65)';c.beginPath();c.arc(e[0]-1,e[1]-1,1.2,0,Math.PI*2);c.fill();});
  c.fillStyle=h.nose;c.beginPath();c.ellipse(0,-1,3.5,3,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(100,80,60,0.4)';c.lineWidth=0.8;[[-18,-3,-7,-4],[-18,1,-7,0],[18,-3,7,-4],[18,1,7,0]].forEach(function(w){c.beginPath();c.moveTo(w[0],w[1]);c.lineTo(w[2],w[3]);c.stroke();});
  c.restore();
  if(h.yuanbao){drawYuanbao(c,x,y-38,0.9);}
}
function drawSelectScreen(){
  var grd=ct.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#fdf8f0');grd.addColorStop(1,'#ede0c8');ct.fillStyle=grd;ct.fillRect(0,0,W,H);
  ct.fillStyle='#4a2e10';ct.font='bold 20px Georgia,serif';ct.textAlign='center';ct.fillText('Choose Your Hamster',W/2,42);
  ct.fillStyle='#9a7050';ct.font='12px sans-serif';ct.fillText('Click to select, then press Play',W/2,62);
  ct.strokeStyle='rgba(150,110,60,0.25)';ct.lineWidth=1;ct.beginPath();ct.moveTo(50,74);ct.lineTo(W-50,74);ct.stroke();
  HAMS.forEach(function(h,i){
    var b=cardBounds(i),sel=selectedHam===i,hov=selHover===i;
    ct.fillStyle=sel?'#c8924a':(hov?'#f0e0c8':'#faf4ec');ct.strokeStyle=sel?'#8a5a18':(hov?'#c09060':'rgba(180,140,90,0.35)');
    ct.lineWidth=sel?2.5:1.2;ct.fillRect(b.x,b.y,b.w,b.h);ct.strokeRect(b.x,b.y,b.w,b.h);
    drawHamPortrait(ct,h,b.x+b.w/2,b.y+50,h.type==='syrian'?1.1:0.88);
    ct.fillStyle=h.type==='syrian'?'#b86830':'#4a80a8';ct.fillRect(b.x+6,b.y+6,h.type==='syrian'?46:36,15);
    ct.fillStyle='#fff';ct.font='bold 8px sans-serif';ct.textAlign='center';ct.fillText(h.type==='syrian'?'Syrian':'Dwarf',b.x+6+(h.type==='syrian'?23:18),b.y+16);
    ct.fillStyle=sel?'#fff':'#3a2008';ct.font='bold 16px sans-serif';ct.textAlign='center';ct.fillText(h.name,b.x+b.w/2,b.y+b.h-32);
    ct.fillStyle=sel?'rgba(255,255,255,0.85)':'#9a7050';ct.font='11px sans-serif';ct.fillText(h.roman,b.x+b.w/2,b.y+b.h-16);
    ct.fillStyle=sel?'rgba(255,255,255,0.7)':'#b8987a';ct.font='9px sans-serif';ct.fillText(h.desc,b.x+b.w/2,b.y+b.h-3);
    if(sel){ct.fillStyle='#6a3e12';ct.beginPath();ct.arc(b.x+b.w-10,b.y+10,9,0,Math.PI*2);ct.fill();ct.fillStyle='#fff';ct.font='bold 10px sans-serif';ct.textAlign='center';ct.fillText('\u2713',b.x+b.w-10,b.y+14);}
  });
  var bx=W/2-55,by=H-54,bw=110,bh=38;ct.fillStyle='#6a3e12';ct.fillRect(bx,by,bw,bh);ct.fillStyle='rgba(255,255,255,0.14)';ct.fillRect(bx,by,bw,bh*0.45);
  ct.fillStyle='#fff';ct.font='bold 14px sans-serif';ct.textAlign='center';ct.fillText('\u25b6  Play',W/2,by+24);
}

function evPos(e){var r=cv.getBoundingClientRect();var src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(W/r.width),y:(src.clientY-r.top)*(H/r.height)};}
function tryStartDrag(mx,my){
  if(gameScreen!=='game')return false;var bx=BASKX(),by=BASKY();
  for(var i=0;i<basketSeeds.length;i++){var s=basketSeeds[i];if(s.eaten||s.dragging)continue;var sx=bx+s.ox,sy=by-16+s.oy;if(Math.hypot(mx-sx,my-sy)<16){s.dragging=true;drag.active=true;drag.seedIdx=i;drag.x=mx;drag.y=my;drag.type=s.type;drag.angle=s.ox*0.08;return true;}}
  return false;
}
function dropSeed(mx,my){
  if(!drag.active)return;var hp=hamPos();var s=basketSeeds[drag.seedIdx];
  if(Math.hypot(mx-hp.x,my-hp.y)<65&&(mode==='wander'||mode==='happy')){
    s.eaten=true;s.dragging=false;
    if(s.type==='sunflower'){shells.push({x:hp.x+(Math.random()-0.5)*24,y:feetY(hp.y)+4+Math.random()*6,angle:(Math.random()-0.5)*1.5});}
    mode='eating';eatTimer=150;hdir=drag.x<hp.x?-1:1;say('Nom nom nom!');setTimeout(function(){s.eaten=false;},8000);
  } else {s.dragging=false;}
  drag.active=false;drag.seedIdx=-1;
}

backBtn.addEventListener('click',function(){gameScreen='select';backBtn.style.display='none';st.textContent='';selHover=-1;});

function handleClick(mx,my){
  if(gameScreen==='select'){
    HAMS.forEach(function(_,i){var b=cardBounds(i);if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h)selectedHam=i;});
    if(mx>=W/2-55&&mx<=W/2+55&&my>=H-54&&my<=H-16){gameScreen='game';buildBg();resetGame();say('Welcome, '+HAMS[selectedHam].name+' ('+HAMS[selectedHam].roman+')! \u2665');backBtn.style.display='block';setTimeout(spawnPoop,1500);}
    return;
  }
  if(tryStartDrag(mx,my))return;
  for(var i=poops.length-1;i>=0;i--){var p=poops[i];var hit=false;for(var j=0;j<p.pellets.length;j++){var pel=p.pellets[j];if(Math.hypot(mx-(p.x+pel.dx),my-(p.y+pel.dy))<pel.rx*3){hit=true;break;}}if(hit){flyingPoops.push({sx:p.x,sy:p.y,pellets:p.pellets,t:0});poops.splice(i,1);binCount++;say('Cleaned! '+binCount+' poop'+(binCount===1?'':'s')+' in bin');return;}}
  for(var si=shells.length-1;si>=0;si--){var sh=shells[si];if(Math.hypot(mx-sh.x,my-sh.y)<16){flyingItems.push({sx:sh.x,sy:sh.y,angle:sh.angle,t:0});shells.splice(si,1);say('Shell binned!');return;}}
  var wr=WR(),wcx2=WCX(),wcy2=WCY();if(Math.hypot(mx-wcx2,my-wcy2)<=wr+14){if(mode==='wander'){goWheel();return;}if(mode==='onwheel'){wTimer=0;runTgt=0;return;}}
  var bx2=BCX(),by2=BCY();if(mx>=bx2-12&&mx<=bx2+34&&my>=by2-22&&my<=by2+74){if(mode==='wander'){goDrink();return;}}
  var hutX=HUT_X();if(Math.abs(mx-hutX)<36&&my>=FLY()-50&&my<=FLY()+20){if(mode==='wander'){goNap();return;}if(mode==='napping'){napTimer=0;return;}}
  var hp=hamPos();if(Math.hypot(mx-hp.x,my-hp.y)<55){
    if(mode==='onwheel'){wTimer=0;runTgt=0;return;}if(mode==='napping'){napTimer=0;return;}
    if(mode==='wander'||mode==='happy'){mode='happy';htimer=90+Math.floor(Math.random()*60);spawnHearts(hp.x,hp.y-20);say(HAMS[selectedHam].name+' is happy! \u2665');return;}
  }
}

cv.addEventListener('mousedown',function(e){var pos=evPos(e);handleClick(pos.x,pos.y);});
cv.addEventListener('mousemove',function(e){var pos=evPos(e);if(gameScreen==='select'){selHover=-1;HAMS.forEach(function(_,i){var b=cardBounds(i);if(pos.x>=b.x&&pos.x<=b.x+b.w&&pos.y>=b.y&&pos.y<=b.y+b.h)selHover=i;});return;}if(drag.active){drag.x=pos.x;drag.y=pos.y;}});
cv.addEventListener('mouseup',function(e){var pos=evPos(e);dropSeed(pos.x,pos.y);});
cv.addEventListener('touchstart',function(e){e.preventDefault();var pos=evPos(e);handleClick(pos.x,pos.y);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();if(drag.active){var pos=evPos(e);drag.x=pos.x;drag.y=pos.y;}},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();if(e.changedTouches.length>0){var t=e.changedTouches[0];var r=cv.getBoundingClientRect();dropSeed((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));}},{passive:false});

function loop(){requestAnimationFrame(loop);if(gameScreen==='select'){drawSelectScreen();return;}tick();draw();}
loop();
})();
</script>
